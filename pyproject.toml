# Settings for the Python tooling only; scripts/ and .claude/skills/ hold
# standalone stdlib-only scripts, not a package.

[tool.ruff]
target-version = "py312"
line-length = 120
format.indent-style = "space"
format.quote-style = "double"
lint.select = ["ALL"]
lint.ignore = [
  "COM812",
  "CPY001", # Missing copyright notice (this project does not use file headers)
  "D",
]
# Both are command-line scripts: they print their results, fetch fixed https URLs
# and call `gh` from PATH
lint.per-file-ignores.".claude/skills/**/*.py" = ["S603", "S607", "T201"]
lint.per-file-ignores."scripts/*.py" = ["S310", "S603", "S607", "T201"]

[tool.ty]
environment.python-version = "3.12"
src.include = [".claude/skills", "scripts"]
