[settings]
minimum_release_age = "7d"

[tools]
pinact = "latest" # [skip ci]
node = "24"
pnpm = "12"
python = "latest"
uv = "latest"

[tasks.init]
description = "Install dependencies and the git pre-commit hook"
run = ["pnpm install", "mise generate git-pre-commit --write --task pre-commit"]

[tasks.format]
description = "Format files"
run = ["pnpm fmt", "uvx ruff format"]

[tasks.lint]
description = "Lint JS, CSS, HTML and Python"
run = ["pnpm lint", "pnpm knip", "uvx ruff check", "uvx ty check"]

[tasks.pre-commit]
description = "Check formatting and lint without modifying files"
run = ["pnpm fmt:check", "uvx ruff format --check", "mise run lint"]

[tasks.ci]
description = "Install dependencies, then check formatting and lint"
run = ["pnpm install --frozen-lockfile", "mise run pre-commit"]

[tasks.update-docs]
description = "Regenerate the GitHub Pages lists, sitemap and activity bars"
run = "python3 scripts/update.py"

[tasks.serve]
description = "Serve ./docs at http://localhost:8000"
run = "python3 -m http.server --directory docs 8000"

[tasks.pinup]
description = "Update the pinned action digests"
run = "pinact run -u --min-age 7"
